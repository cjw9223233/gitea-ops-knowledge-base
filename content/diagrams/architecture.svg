<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-t">
<title id="arch-t">圖：系統全貌——使用者、正式主機（Docker 內的 Gitea 與 PostgreSQL）與備機</title>
<defs><marker id="arch-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c6c78"/></marker></defs>
<rect class="box2" x="14" y="40" width="150" height="62" rx="10"/><text x="89" y="66" text-anchor="middle" font-size="15" font-weight="700">開發者／使用者</text><text x="89" y="86" text-anchor="middle" class="small">瀏覽器、git</text>
<rect class="box2" x="14" y="250" width="150" height="62" rx="10"/><text x="89" y="276" text-anchor="middle" font-size="15" font-weight="700">維運人員</text><text x="89" y="296" text-anchor="middle" class="small">SSH 登入主機</text>
<rect class="warnbox" x="196" y="128" width="104" height="104" rx="10"/><text x="248" y="160" text-anchor="middle" font-size="14" font-weight="700">網路白名單</text><text x="248" y="180" text-anchor="middle" class="small">上游 ACL</text><text x="248" y="196" text-anchor="middle" class="small">iptables</text><text x="248" y="212" text-anchor="middle" class="small">DOCKER-USER</text>
<rect class="box" x="332" y="14" width="296" height="352" rx="14"/><text x="480" y="38" text-anchor="middle" font-size="15" font-weight="700">正式主機 coffee · 10.253.114.160</text><text x="480" y="56" text-anchor="middle" class="small">Ubuntu 24.04 · Docker · 同網卡另有 192.168.1.2</text>
<rect class="box2" x="354" y="74" width="252" height="118" rx="10"/><text x="480" y="98" text-anchor="middle" font-size="14" font-weight="700">gitea-server-1（Gitea 1.23）</text><text x="480" y="120" text-anchor="middle" class="small">TCP 3000：網站／HTTP　TCP 2222：Git SSH</text><text x="480" y="140" text-anchor="middle" class="small">容器內以 UID 1000 執行</text><text x="480" y="160" text-anchor="middle" class="small">資料 /home/Gitea/data、config</text>
<rect class="box2" x="354" y="214" width="252" height="76" rx="10"/><text x="480" y="238" text-anchor="middle" font-size="14" font-weight="700">gitea-db-1（PostgreSQL 14）</text><text x="480" y="258" text-anchor="middle" class="small">db:5432，只在 Docker 私有網路</text><text x="480" y="276" text-anchor="middle" class="small">資料 /home/Gitea/postgres</text>
<rect class="warnbox" x="354" y="306" width="252" height="46" rx="10"/><text x="480" y="326" text-anchor="middle" font-size="13" font-weight="700">root 排程 gitea_maintenance.py</text><text x="480" y="342" text-anchor="middle" class="small">20:30 冷備份 · 週六 09:00 · 22:00 關機</text>
<rect class="okbox" x="662" y="128" width="104" height="104" rx="10"/><text x="714" y="158" text-anchor="middle" font-size="14" font-weight="700">備機</text><text x="714" y="178" text-anchor="middle" class="small">192.168.1.3</text><text x="714" y="196" text-anchor="middle" class="small">接收備份封存檔</text><text x="714" y="212" text-anchor="middle" class="small">（冷，非即時接手）</text>
<path class="line" d="M164 71 L196 150" marker-end="url(#arch-arr)"/><path class="line" d="M300 170 L354 140" marker-end="url(#arch-arr)"/><path class="line" d="M480 192 L480 214" marker-end="url(#arch-arr)"/>
<path class="line" d="M164 281 L332 281" marker-end="url(#arch-arr)"/><text x="248" y="272" text-anchor="middle" class="small">SSH 22</text>
<path class="line" d="M628 330 L714 330 L714 232" marker-end="url(#arch-arr)"/><text x="672" y="322" text-anchor="middle" class="small">SSH＋校驗</text>
<text x="180" y="156" class="small">3000/2222</text>
</svg>
