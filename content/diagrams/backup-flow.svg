<svg viewBox="0 0 780 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bf-t">
<title id="bf-t">圖：備份資料流——平日 daily 冷備份並外送備機，週六 weekly 只存本機</title>
<defs><marker id="bf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c6c78"/></marker></defs>
<text x="14" y="22" font-size="14" font-weight="700">平日 20:30　daily</text>
<rect class="box2" x="14" y="34" width="118" height="74" rx="10"/><text x="73" y="60" text-anchor="middle" font-size="13" font-weight="700">① 停止服務</text><text x="73" y="80" text-anchor="middle" class="small">先停 Gitea 再停 DB</text><text x="73" y="96" text-anchor="middle" class="small">約 3 分鐘</text>
<rect class="box2" x="158" y="34" width="118" height="74" rx="10"/><text x="217" y="60" text-anchor="middle" font-size="13" font-weight="700">② 打包</text><text x="217" y="80" text-anchor="middle" class="small">gitea-cold.tar.gz</text><text x="217" y="96" text-anchor="middle" class="small">恢復服務＋healthz</text>
<rect class="okbox" x="302" y="34" width="150" height="74" rx="10"/><text x="377" y="58" text-anchor="middle" font-size="13" font-weight="700">③ 本機 daily/</text><text x="377" y="78" text-anchor="middle" class="small">/var/backups/</text><text x="377" y="94" text-anchor="middle" class="small">gitea-maintenance（SUCCESS）</text>
<rect class="box2" x="478" y="34" width="132" height="74" rx="10"/><text x="544" y="58" text-anchor="middle" font-size="13" font-weight="700">④ root→coffee SSH</text><text x="544" y="78" text-anchor="middle" class="small">stdin 串流到備機</text><text x="544" y="94" text-anchor="middle" class="small">寫入 .partial</text>
<rect class="okbox" x="636" y="34" width="132" height="74" rx="10"/><text x="702" y="58" text-anchor="middle" font-size="13" font-weight="700">⑤ 備機</text><text x="702" y="78" text-anchor="middle" class="small">sha256sum -c 通過</text><text x="702" y="94" text-anchor="middle" class="small">才改名發布</text>
<path class="line" d="M132 71 L158 71" marker-end="url(#bf-arr)"/><path class="line" d="M276 71 L302 71" marker-end="url(#bf-arr)"/><path class="line" d="M452 71 L478 71" marker-end="url(#bf-arr)"/><path class="line" d="M610 71 L636 71" marker-end="url(#bf-arr)"/>
<path class="dash" d="M702 108 L702 150 L377 150 L377 108" marker-end="url(#bf-arr)"/><text x="540" y="168" text-anchor="middle" class="small">成功後本機寫入 REMOTE_SUCCESS，才允許清理舊備份</text>
<text x="14" y="212" font-size="14" font-weight="700">週六 09:00　weekly（只存本機，不外送）</text>
<rect class="box2" x="14" y="224" width="200" height="74" rx="10"/><text x="114" y="250" text-anchor="middle" font-size="13" font-weight="700">最近 72 小時內合格的 daily</text><text x="114" y="270" text-anchor="middle" class="small">不新增週六 Gitea 停機</text><text x="114" y="286" text-anchor="middle" class="small">先驗證其校驗值</text>
<rect class="box2" x="244" y="224" width="200" height="74" rx="10"/><text x="344" y="250" text-anchor="middle" font-size="13" font-weight="700">系統檔案</text><text x="344" y="270" text-anchor="middle" class="small">/etc、/home、docker volumes</text><text x="344" y="286" text-anchor="middle" class="small">（排除 home/Gitea、.cache）</text>
<rect class="warnbox" x="474" y="224" width="294" height="74" rx="10"/><text x="621" y="250" text-anchor="middle" font-size="13" font-weight="700">本機 weekly/（保留 2 份）</text><text x="621" y="270" text-anchor="middle" class="small">Gitea 時間點＝引用的 daily，不是週六當刻</text><text x="621" y="286" text-anchor="middle" class="small">⚠ 尚未外送備機</text>
<path class="line" d="M214 261 L244 261" marker-end="url(#bf-arr)"/><path class="line" d="M444 261 L474 261" marker-end="url(#bf-arr)"/>
</svg>
